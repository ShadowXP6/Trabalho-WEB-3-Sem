<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reset.css">
  
</head>
<body>
  <h1>Fale comigo</h1>
  <form action="#" method="post">
    <label for="nome">Nome</label><br>

    <label for="mensagem">Mensagem</label><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
